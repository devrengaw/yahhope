name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: wamgkgaemfnkcmokxqfe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify SUPABASE_ACCESS_TOKEN
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::A secret SUPABASE_ACCESS_TOKEN não está configurada em Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

      - name: Deploy Edge Functions (JWT verified)
        run: |
          supabase functions deploy send-campaign --remote=$PROJECT_REF --yes
          supabase functions deploy send-accountability --remote=$PROJECT_REF --yes
          supabase functions deploy create-checkout --remote=$PROJECT_REF --yes
          supabase functions deploy delete-user --remote=$PROJECT_REF --yes
          supabase functions deploy invite-user --remote=$PROJECT_REF --yes

      - name: Deploy Edge Functions (Public / Webhooks - No JWT)
        run: |
          supabase functions deploy track-campaign --remote=$PROJECT_REF --no-verify-jwt --yes
          supabase functions deploy stripe-webhook --remote=$PROJECT_REF --no-verify-jwt --yes
          supabase functions deploy infinitepay-webhook --remote=$PROJECT_REF --no-verify-jwt --yes
          supabase functions deploy resend-webhook --remote=$PROJECT_REF --no-verify-jwt --yes
